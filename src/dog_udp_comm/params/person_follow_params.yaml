tracking_string_bridge:
  ros__parameters:
    tracking_topic: /tracking
    state_topic: /tracking_state
    pixel_topic: /tracking_pixel
    image_width: 640.0
    image_height: 384.0
    max_allowed_age_ms: 1000.0
    max_consecutive_drop: 3
    warn_interval_sec: 1.0
    use_source_timestamp_for_header: true
    relative_timestamp_threshold_ms: 1000000000.0
    topic_check_period_sec: 0.5
    tracking_topic_lost_timeout_sec: 1.0

pixel_to_scan_polar:
  ros__parameters:
    scan_topic: /scan
    pixel_topic: /tracking_pixel
    out_topic: /person_polar
    fx: 600.0
    cx: 320.0
    yaw_cam_to_lidar: 0.0
    search_half_window: 6
    range_min_valid: 0.10
    range_max_valid: 10.0
    prefer_scan_angle_output: false
    publish_debug: false

host_mpc_controller:
  ros__parameters:
    person_topic: /person_polar
    tracking_state_topic: /tracking_state
    cmd_topic: /track_cmd_vel
    control_hz: 50.0
    dt: 0.0
    horizon: 12
    msg_timeout: 1.0
    tracking_state_timeout_sec: 1.0
    require_first_tracking_frame: true
    desired_distance: 1.2
    desired_angle: 0.0
    distance_tolerance: 0.08
    angle_tolerance: 0.08
    stop_when_aligned: true
    stop_on_lost_target: true
    allow_reverse: false
    target_lost_duration_sec: 1.0
    max_v: 0.8
    max_w: 6.0
    max_reverse_v: 0.2
    force_zero_linear_velocity: false
    reverse_angular_output: true
    q_dist: 16.0
    q_angle: 35.0
    r_v: 0.35
    r_w: 0.06
    qf_scale: 4.0
    kff_dist: 0.9
    kff_angle: 3.0
    use_tracking_x_for_angle: true
    tracking_x_target: 0.5
    tracking_x_deadband: 0.003
    tracking_x_timeout_sec: 1.0
    enable_angle_prediction: true
    max_prediction_sec: 0.35
    angle_rate_filter_alpha: 0.6
    max_angle_rate: 3.5
    enable_tracking_only_fallback: true
    tracking_only_linear_speed: 0.08
    tracking_only_kp_w: 3.0
    tracking_only_kd_w: 0.4
    image_width: 640.0
    fx: 600.0
    cx: 320.0
    yaw_cam_to_control: 0.0
    tracking_angle_gain: 3.5
    distance_filter_alpha: 0.65
    angle_filter_alpha: 0.65
    min_valid_distance: 0.15
    max_valid_distance: 8.0
    enable_distance_speed_profile: true
    speed_profile_near_distance: 1.3
    speed_profile_far_distance: 3.2
    speed_profile_min_v: 0.10
    speed_profile_max_v: 0.8
    angle_priority_threshold: 0.30
    min_heading_speed_scale: 0.20
    max_accel: 1.20
    max_w_accel: 20.0

udp_cmd_vel_server:
  ros__parameters:
    local_ip: 0.0.0.0
    local_port: 8888
    use_fixed_receiver: false
    remote_ip: 192.168.19.90
    remote_port: 8890
